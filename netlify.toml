# This section handles the redirect for your React app's routing, preventing 404 errors.
[[redirects]]
  from = "/*"
  to = "/hpgpsFilemanager.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # MyGeotab fetches the add-in files from whichever host serves the database
    # (my.geotab.com, mobilizz.geotab.com, other reseller domains), so a single
    # fixed origin blocks every other host. These are public static assets.
    Access-Control-Allow-Origin = "*"

    Content-Security-Policy = "frame-ancestors 'self' https://my.geotab.com;"